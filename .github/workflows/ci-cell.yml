name: CI cell

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        type: string
        default: Release
      c-compiler:
        required: true
        type: string
      cell-id:
        required: true
        type: string
      cpp-compiler:
        required: true
        type: string
      no-b64:
        required: false
        type: boolean
        default: false
      no-shwild:
        required: false
        type: boolean
        default: false
      os:
        required: true
        type: string
      toolchain:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.cell-id }})
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux' && inputs.c-compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      # Dependency order (not lexicographic): each package is configured
      # against those already installed under the shared prefix. Optional
      # packages are omitted when the corresponding no-* input is true.
      - name: Install Synesis dependencies
        uses: ./.github/actions/install-sis-deps
        with:
          build-type: ${{ inputs.build-type }}
          c-compiler: ${{ inputs.c-compiler }}
          cpp-compiler: ${{ inputs.cpp-compiler }}
          dependencies: >-
            STLSoft
            ${{ !inputs.no-shwild && 'shwild' || '' }}
            xTests
            ${{ !inputs.no-b64 && 'b64' || '' }}
          toolchain: ${{ inputs.toolchain }}

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          NO_B64_OPT=""
          if [ "${{ inputs.no-b64 }}" = "true" ]; then
            NO_B64_OPT="-DNO_B64=ON"
          fi
          NO_SHWILD_OPT=""
          if [ "${{ inputs.no-shwild }}" = "true" ]; then
            NO_SHWILD_OPT="-DNO_SHWILD=ON -DCMAKE_DISABLE_FIND_PACKAGE_shwild=TRUE"
          fi
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            cmake -B build -S . \
              -DCMAKE_DISABLE_FIND_PACKAGE_MFC=TRUE \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=ON \
              -DBUILD_TESTING=ON \
              $NO_B64_OPT \
              $NO_SHWILD_OPT
          elif [ "${{ inputs.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake -B build -S . -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_C_COMPILER="${{ inputs.c-compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ inputs.cpp-compiler }}" \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=ON \
              -DBUILD_TESTING=ON \
              $NO_B64_OPT \
              $NO_SHWILD_OPT
          else
            cmake -B build -S . \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_C_COMPILER="${{ inputs.c-compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ inputs.cpp-compiler }}" \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=ON \
              -DBUILD_TESTING=ON \
              $NO_B64_OPT \
              $NO_SHWILD_OPT
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            cmake --build build --config "${{ inputs.build-type }}" --parallel
          elif [ "${{ inputs.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake --build build --parallel 2
          else
            cmake --build build --parallel
          fi

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build
          retention-days: 1

  # Windows cells dogfood the native .cmd runners (never the .sh); every
  # other cell uses the Bash runners. Scratch must gate the Phase 4c
  # reporter (no continue-on-error greenwash).
  run-examples:
    name: Examples (${{ inputs.cell-id }})
    needs: build
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      # download-artifact does not restore Unix execute bits;
      # run_all_*.sh discovery requires -perm -100 (or *.exe on Windows).
      # Skip CMakeFiles and compiler deps — name globs also match
      # e.g. test.component.*.cpp.o.d / example*.c.o.d; chmod +x on those
      # makes tip runners treat them as programs (exit 127).
      - name: Restore execute bits on test and example binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find build -type f \
            ! -path '*/CMakeFiles/*' \
            ! -name '*.d' \
            ! -name '*.o' \
            ! -name '*.obj' \
            \( \
              -name 'test_unit*' -o -name 'test.unit.*' -o \
              -name 'test_component*' -o -name 'test.component.*' -o \
              -name 'test_performance*' -o -name 'test.performance.*' -o \
              -name 'test_scratch*' -o -name 'test.scratch.*' -o \
              \( -name 'example*' ! -name '*.md' \) \
            \) -exec chmod +x {} +

      - name: Run examples (Bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_examples.sh -M

      - name: Run examples (native cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
        run: |
          if "${{ inputs.toolchain }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_examples.cmd
          if errorlevel 1 exit /b 1

  test-unit:
    name: Unit tests (${{ inputs.cell-id }})
    needs: build
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      # download-artifact does not restore Unix execute bits;
      # run_all_*.sh discovery requires -perm -100 (or *.exe on Windows).
      # Skip CMakeFiles and compiler deps — name globs also match
      # e.g. test.component.*.cpp.o.d / example*.c.o.d; chmod +x on those
      # makes tip runners treat them as programs (exit 127).
      - name: Restore execute bits on test and example binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find build -type f \
            ! -path '*/CMakeFiles/*' \
            ! -name '*.d' \
            ! -name '*.o' \
            ! -name '*.obj' \
            \( \
              -name 'test_unit*' -o -name 'test.unit.*' -o \
              -name 'test_component*' -o -name 'test.component.*' -o \
              -name 'test_performance*' -o -name 'test.performance.*' -o \
              -name 'test_scratch*' -o -name 'test.scratch.*' -o \
              \( -name 'example*' ! -name '*.md' \) \
            \) -exec chmod +x {} +

      - name: Run unit tests (Bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_unit_tests.sh -M --unit-only

      - name: Run unit tests (native cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
        run: |
          if "${{ inputs.toolchain }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_unit_tests.cmd --unit-only
          if errorlevel 1 exit /b 1

  test-component:
    name: Component tests (${{ inputs.cell-id }})
    needs: build
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      # download-artifact does not restore Unix execute bits;
      # run_all_*.sh discovery requires -perm -100 (or *.exe on Windows).
      # Skip CMakeFiles and compiler deps — name globs also match
      # e.g. test.component.*.cpp.o.d / example*.c.o.d; chmod +x on those
      # makes tip runners treat them as programs (exit 127).
      - name: Restore execute bits on test and example binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find build -type f \
            ! -path '*/CMakeFiles/*' \
            ! -name '*.d' \
            ! -name '*.o' \
            ! -name '*.obj' \
            \( \
              -name 'test_unit*' -o -name 'test.unit.*' -o \
              -name 'test_component*' -o -name 'test.component.*' -o \
              -name 'test_performance*' -o -name 'test.performance.*' -o \
              -name 'test_scratch*' -o -name 'test.scratch.*' -o \
              \( -name 'example*' ! -name '*.md' \) \
            \) -exec chmod +x {} +

      - name: Run component tests (Bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_component_tests.sh -M

      - name: Run component tests (native cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
        run: |
          if "${{ inputs.toolchain }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_component_tests.cmd
          if errorlevel 1 exit /b 1

  test-scratch:
    name: Scratch tests (${{ inputs.cell-id }})
    needs: build
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      # download-artifact does not restore Unix execute bits;
      # run_all_*.sh discovery requires -perm -100 (or *.exe on Windows).
      # Skip CMakeFiles and compiler deps — name globs also match
      # e.g. test.component.*.cpp.o.d / example*.c.o.d; chmod +x on those
      # makes tip runners treat them as programs (exit 127).
      - name: Restore execute bits on test and example binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find build -type f \
            ! -path '*/CMakeFiles/*' \
            ! -name '*.d' \
